<!-- Rafael Bosi: botão flutuante de WhatsApp + ponte de rastreamento dos CTAs (Custom Embed, BODY_END) -->
<style>
  .rb-wa{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:2147483000;display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;background:#0E4D30;color:#fff;font:600 15px/1 Figtree,Helvetica,Arial,sans-serif;text-decoration:none;box-shadow:0 6px 20px rgba(10,51,34,.28);transition:transform .2s ease,opacity .3s ease;opacity:0;transform:translateY(12px);pointer-events:none}
  .rb-wa.rb-on{opacity:1;transform:none;pointer-events:auto}
  .rb-wa:hover{background:#0A3322}
  .rb-wa:focus-visible{outline:3px solid #E8601A;outline-offset:3px}
  .rb-wa svg{width:20px;height:20px;flex:none}
  @media (max-width:480px){.rb-wa span{display:none}.rb-wa{padding:14px}}
  @media (prefers-reduced-motion:reduce){.rb-wa{transition:none}}
  @media print{.rb-wa{display:none}}
</style>
<script>
(function(){
  if (window.__rbWa) return; window.__rbWa = true;
  function track(destino, origem){
    var ev = {event:'cta_click', cta_destino:destino, cta_origem:origem, page_path:location.pathname};
    try { (window.dataLayer = window.dataLayer || []).push(ev); } catch(e){}
    try { if (typeof window.gtag === 'function') window.gtag('event','cta_click',{cta_destino:destino,cta_origem:origem}); } catch(e){}
    try { if (typeof window.fbq === 'function') window.fbq('trackCustom','CTAClick',{destino:destino,origem:origem}); } catch(e){}
    try { if (window._hsq) window._hsq.push(['trackCustomBehavioralEvent',{name:'cta_click',properties:{destino:destino}}]); } catch(e){}
  }
  // Cliques vindos do bloco HTML da home (postMessage { tipo:'cta', destino })
  // Acha o iframe da página que contém quem mandou a mensagem
  function frameOf(src){
    var w = src;
    try { while (w && w.parent && w.parent !== window) w = w.parent; } catch(err){}
    var fs = document.getElementsByTagName('iframe');
    for (var i = 0; i < fs.length; i++) { if (fs[i].contentWindow === w) return fs[i]; }
    return null;
  }
  window.addEventListener('message', function(e){
    var d = e && e.data;
    if (!d || typeof d !== 'object') return;
    if (d.tipo === 'cta' && typeof d.destino === 'string') track(d.destino, typeof d.origem === 'string' ? d.origem : 'home');
    if (d.tipo === 'rolar' && typeof d.y === 'number') {
      var f = frameOf(e.source);
      if (!f) return;
      var top = f.getBoundingClientRect().top + (window.scrollY || window.pageYOffset || 0) + d.y - 16;
      try { window.scrollTo({ top: Math.max(0, top), behavior: d.suave ? 'smooth' : 'auto' }); } catch(err){ window.scrollTo(0, Math.max(0, top)); }
    }
  });
  function waUrl(){
    var path = location.pathname || '/';
    var msg = path.indexOf('/clareza') === 0 ? 'Oi Rafael! Vim pela página da Série Clareza Digital e tenho uma dúvida.'
      : path.indexOf('/mentoria-estrategica') === 0 ? 'Oi Rafael! Vim pela página da Mentoria Estratégica e quero saber mais.'
      : 'Oi Rafael! Vim pelo seu site.';
    return 'https://wa.me/14384059109?text=' + encodeURIComponent(msg);
  }
  function mount(){
    var a = document.createElement('a');
    a.className = 'rb-wa';
    a.href = waUrl();
    a.target = '_blank'; a.rel = 'noopener';
    a.setAttribute('aria-label','Falar com o Rafael no WhatsApp');
    a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.2-.2-.4-.3Z"/></svg><span>Falar no WhatsApp</span>';
    a.addEventListener('click', function(){ a.href = waUrl(); track('whatsapp','botao_flutuante'); });
    document.body.appendChild(a);
    // Aparece depois de uma rolagem curta, pra não competir com o topo da página
    function check(){ if ((window.scrollY || 0) > 320) { a.classList.add('rb-on'); window.removeEventListener('scroll', check); } }
    window.addEventListener('scroll', check, {passive:true}); check();
  }
  if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
})();
</script>
