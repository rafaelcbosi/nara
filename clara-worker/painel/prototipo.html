 {q:"Minha sócia quer investir em anúncio mas a gente ainda não vendeu nada",who:"Luana Dias",a:"Anúncio acelera o que já funciona.\n\nSe vocês ainda não vendem sem anúncio, acerta a oferta primeiro com 5 a 10 vendas. Depois começa pequeno: R$ 10 a R$ 20 por dia.",src:"Base: Anúncios"},
];
let cur=1,filter="todas",view="conversas";
const $=s=>document.querySelector(s);
const ago=t=>{const h=(now-t)/H;return h<1?Math.max(1,Math.round(h*60))+" min":h<24?Math.round(h)+" h":Math.round(h/24)+" d"};
const hhmm=off=>{const d=new Date(now+off*H);return d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};
const ini=n=>n.split(" ").map(p=>p[0]).slice(0,2).join("");
const chip=(k,rm)=>`<span class="chip ${TAGS[k].c}">${TAGS[k].l}${rm?` <button aria-label="Remover ${TAGS[k].l}" data-rm="${k}">×</button>`:""}</span>`;
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,2400)}
const FILTERS=[["todas","Todas"],["quente","Lead quente"],["rafael","Precisa do Rafael"],["cliente","Clientes"],["pausada","Clara pausada"],["naolida","Não lidas"]];
function passes(c){const s=$("#search").value.trim().toLowerCase();if(s&&!(c.name.toLowerCase().includes(s)||c.num.includes(s)))return false;
 if(filter==="todas")return true;if(filter==="pausada")return !c.ativa;if(filter==="naolida")return c.unread>0;return c.tags.includes(filter)}
function renderFilters(){$("#filters").innerHTML=FILTERS.map(([k,l])=>`<button data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("")}
function renderList(){const L=C.filter(passes).sort((a,b)=>b.last-a.last);
 $("#items").innerHTML=L.length?L.map(c=>`<button class="item" data-id="${c.id}" aria-current="${c.id===cur}"><div class="av">${ini(c.name)}</div><div style="min-width:0"><div class="name">${c.name}${c.ativa?"":' <span class="chip t-rafael">Pausada</span>'}</div><div class="prev">${last(c)}</div><div class="chips">${c.tags.filter(t=>t!=="whatsapp").map(t=>chip(t)).join("")}</div></div><div class="meta">${ago(c.last)}${c.unread?`<span class="unread">${c.unread}</span>`:""}</div></button>`).join(""):`<p style="padding:16px;color:var(--muted)">Nenhuma conversa com esse filtro.</p>`;
 $("#c-conv").textContent=C.reduce((s,c)=>s+c.unread,0)}
function last(c){const m=c.m[c.m.length-1];const who=m[0]==="cliente"?"":m[0]==="clara"?"Clara: ":"Você: ";return who+(m[3]||m[1]).replace(/\n/g," ")}
function renderChat(){const c=C.find(x=>x.id===cur);if(!c)return;c.unread=0;
 $("#h-av").textContent=ini(c.name);$("#h-name").textContent=c.name;$("#h-num").textContent=c.num;
 $("#pause").setAttribute("aria-pressed",c.ativa);$("#pause-l").textContent=c.ativa?"Clara ativa":"Clara pausada";
 const lastCli=Math.max(...c.m.filter(m=>m[0]==="cliente").map(m=>now+m[2]*H));const open=(now-lastCli)<24*H;
 let b="";if(!open)b+=`<div class="banner warn">⏱ Janela de 24h fechada. O cliente não fala há mais de 24h, então a Meta só permite mensagem de modelo aprovado.</div>`;
 if(c.resp>=2)b+=`<div class="banner info">A Clara já respondeu 2 perguntas de estratégia. Agora ela faz a ponte para os produtos.</div>`;
 $("#banners").innerHTML=b;
 $("#msgs").innerHTML=`<div class="day">Conversa</div>`+c.m.map(m=>`<div class="m ${m[0]}"><span class="by">${m[0]==="cliente"?c.name.split(" ")[0]:m[0]==="clara"?"Clara":"Rafael"}</span>${m[3]?`<span class="audio">${m[1]} · transcrição:</span>${m[3]}`:m[1]}<span class="tm">${hhmm(m[2])}</span></div>`).join("");
 $("#msgs").scrollTop=1e6;
 $("#send").disabled=!open;$("#text").disabled=!open;$("#text").placeholder=open?"Responder como Rafael":"Janela fechada: use um modelo aprovado";
 document.querySelectorAll("#quick button").forEach(x=>x.disabled=!open);
 $("#kv").innerHTML=`<dt>Negócio</dt><dd>${c.nicho}</dd><dt>Fase</dt><dd>${c.fase}</dd><dt>Origem</dt><dd>${c.origem}</dd><dt>Respostas de estratégia</dt><dd>${c.resp} de 2</dd>`;
 $("#tags").innerHTML=c.tags.map(t=>chip(t,true)).join("")||'<span class="hint">Sem etiquetas</span>';
 $("#tagsel").innerHTML=Object.keys(TAGS).filter(k=>!c.tags.includes(k)).map(k=>`<option value="${k}">${TAGS[k].l}</option>`).join("")||"<option>Todas aplicadas</option>";
 $("#notes").value=c.notes;
 $("#actions").innerHTML=c.tags.includes("cliente")?`<button class="btn" data-a="resumo">Enviar lembrete dos encontros</button>`:`<button class="btn" data-a="diag">Convidar para o Diagnóstico Estratégico</button><div id="paybox"><button class="btn primary" data-a="pago">Confirmar pagamento da Mentoria</button></div>`;
 renderList()}
function add(role,text){const c=C.find(x=>x.id===cur);c.m.push([role,text,0]);c.last=Date.now();renderChat()}
function setView(v){view=v;document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.view===v));
 const conv=v==="conversas";$("#listView").hidden=!conv;$("#chatView").hidden=!conv;$("#side").hidden=!conv;$("#pageView").hidden=conv;
 if(v==="aprendizado")renderLearn();if(v==="numeros")renderNums()}
function renderLearn(){$("#pageView").innerHTML=`<h1>Aprendizado da Clara</h1><p class="lead">Perguntas novas da semana com a resposta que a Clara deu. Aprovar coloca a resposta na base. Corrigir ensina o seu jeito para todas as respostas parecidas.</p>`+
 (QS.length?QS.map((x,i)=>`<div class="card"><div class="q">“${x.q}”</div><div class="hint">${x.who}</div><div class="ans" id="ans${i}">${x.a}</div><div class="foot"><span class="src">${x.src}</span><button class="btn" data-fix="${i}">Corrigir</button><button class="btn primary" style="background:var(--accent);border-color:var(--accent);color:#1b1300" data-ok="${i}">Aprovar</button></div></div>`).join(""):`<div class="card">Tudo revisado nesta semana. ✨</div>`);
 $("#c-apr").textContent=QS.length}
function renderNums(){const f=[["Conversas novas",42],["Responderam 1 pergunta",31],["Chegaram à oferta",18],["Links do Diagnóstico",7],["Compraram",4]];
 $("#pageView").innerHTML=`<h1>Números da semana</h1><p class="lead">De 22 a 28 de setembro. Dados de exemplo.</p>
 <div class="stats"><div class="stat"><div class="v">42</div><div class="l">conversas novas</div></div><div class="stat"><div class="v">9</div><div class="l">leads quentes</div></div><div class="stat"><div class="v">3</div><div class="l">Séries vendidas (R$ 222)</div></div><div class="stat"><div class="v">1</div><div class="l">Mentoria fechada (R$ 2.300)</div></div></div>
 <div class="card"><b>Da conversa à venda</b><div class="funnel">${f.map(([l,n])=>`<div class="bar"><span>${l}</span><div class="track"><div class="fill" style="width:${n/42*100}%"></div></div><span class="n">${n}</span></div>`).join("")}</div></div>
 <div class="card"><b>De onde vêm</b><div class="funnel">${[["Anúncio Pergunte ao Rafael",23],["Link da bio",14],["Indicação",5]].map(([l,n])=>`<div class="bar"><span>${l}</span><div class="track"><div class="fill" style="width:${n/42*100}%"></div></div><span class="n">${n}</span></div>`).join("")}</div></div>`}

document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.dataset.view){setView(t.dataset.view);return}
 if(t.dataset.f){filter=t.dataset.f;renderFilters();renderList();return}
 if(t.dataset.id){cur=+t.dataset.id;$("#app").classList.add("open");renderChat();return}
 if(t.id==="back"){$("#app").classList.remove("open");return}
 if(t.id==="infobtn"){$("#side").classList.toggle("show");return}
 const c=C.find(x=>x.id===cur);
 if(t.id==="pause"){c.ativa=!c.ativa;renderChat();toast(c.ativa?"Clara retomada nesta conversa":"Clara pausada nesta conversa");return}
 if(t.id==="send"){const v=$("#text").value.trim();if(!v)return;add("rafael",v);$("#text").value="";if(c.ativa){c.ativa=false;renderChat()}toast("Mensagem enviada. Clara pausada por 12h.");return}
 if(t.dataset.q){const T={diag:"Pelo que você me contou, vale uma conversa comigo. Marca o Diagnóstico Estratégico de 30 min aqui: rafaelbosi.com/30-min",serie:"Aqui está a Série Clareza Digital, 4 guias por R$ 74, com garantia de 7 dias: rafaelbosi.com/clareza",ok:"Já te respondo!"};$("#text").value=T[t.dataset.q];$("#text").focus();return}
 if(t.dataset.rm){c.tags=c.tags.filter(x=>x!==t.dataset.rm);renderChat();toast("Etiqueta removida");return}
 if(t.id==="tagadd"){const k=$("#tagsel").value;if(TAGS[k]&&!c.tags.includes(k)){c.tags.push(k);renderChat();toast("Etiqueta adicionada")}return}
 if(t.dataset.a==="diag"){add("clara","Pelo que você me contou, vale uma conversa com o Rafael. Ele tem um Diagnóstico Estratégico de 30 minutos: rafaelbosi.com/30-min");if(!c.tags.includes("quente"))c.tags.push("quente");renderChat();toast("Convite enviado");return}
 if(t.dataset.a==="pago"){$("#paybox").innerHTML=`<div class="confirm">Confirmar que ${c.name.split(" ")[0]} pagou a Mentoria? A Clara envia as boas-vindas com o link dos 4 encontros.<div><button class="btn primary" data-a="pago-sim">Sim, confirmar</button><button class="btn" data-a="pago-nao">Cancelar</button></div></div>`;return}
 if(t.dataset.a==="pago-nao"){renderChat();return}
 if(t.dataset.a==="pago-sim"){c.tags=c.tags.filter(x=>x!=="quente"&&x!=="rafael");if(!c.tags.includes("cliente"))c.tags.push("cliente");add("clara","Seja muito bem-vindo(a) à Mentoria! 🎉 São 4 encontros de 1h30 com o Rafael, em até 45 dias. Agenda o primeiro aqui: rafaelbosi.com/agendamento-mentoria");toast("Cliente ativo. Boas-vindas enviadas.");return}
 if(t.dataset.a==="resumo"){add("clara","Oi! Passando pra lembrar dos seus encontros da Mentoria. Se ainda não marcou os próximos: rafaelbosi.com/agendamento-mentoria");toast("Lembrete enviado");return}
 if(t.dataset.ok){QS.splice(+t.dataset.ok,1);renderLearn();toast("Aprovada e adicionada à base");return}
 if(t.dataset.fix){const i=+t.dataset.fix,el=$("#ans"+i);if(el.isContentEditable){QS[i].a=el.innerText;QS.splice(i,1);renderLearn();toast("Correção salva. A Clara aprendeu seu jeito.")}else{el.contentEditable="true";el.focus();t.textContent="Salvar correção"}return}
});
$("#search").addEventListener("input",renderList);
$("#notes").addEventListener("input",e=>{C.find(x=>x.id===cur).notes=e.target.value});
$("#text").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#send").click()}});
renderFilters();renderChat();$("#c-apr").textContent=QS.length;
</script>
